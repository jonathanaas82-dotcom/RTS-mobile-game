<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#16241a" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Godforge" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="A mythology real-time strategy game for your phone." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Godforge</title>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud" hidden></div>
    <div id="menu" hidden></div>
    <div id="loading" data-i18n="app.loading">Forging the world…</div>
    <div id="rotate">
      <div class="phone"></div>
      <h2 data-i18n="rotate.title">Turn your device</h2>
      <p data-i18n="rotate.body">Godforge is played in landscape.</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
